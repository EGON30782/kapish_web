<!DOCTYPE html>
<html>

<body>
    <h2>javascript array methods</h2>
    <h2>join() and pop()</h2>
    <p>the join() methodscjoins array elements into the string and the pop() methods removes the last elements from an array
    </p>
    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>
    <script>
        var fruits = ["banana", "pear", "apple", "mango"];
        document.getElementById("myjoin").innerHTML = fruits.join(" * ");
        document.getElementById("myfirstpop").innerHTML = fruits;
        fruits.pop();
        document.getElementById("mysecondpop").innerHTML = fruit;
    </script>

</body>
</html>
